name: Prepare Build Tag

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''
    outputs:
      tag:
        description: "Generated tag"
        value: ${{ jobs.prepare.outputs.tag }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve build tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="$(git rev-parse --short HEAD)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Debug output
        run: |
          echo "Resolved build tag: ${{ steps.vars.outputs.tag }}"
