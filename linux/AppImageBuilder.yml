version: 1
script:
  - rm -rf AppDir || true
  - cp -rv build/linux/x64/release/bundle AppDir
  - mkdir -p AppDir/usr/share/icons/hicolor/1024x1024/apps/
  - mkdir -p AppDir/usr/lib
  # /lib will be symlinked by appimage-builder
  - mv AppDir/lib AppDir/usr/
  - cp icon.png AppDir/usr/share/icons/hicolor/1024x1024/apps/icon.png
AppDir:
  path: ./AppDir
  app_info:
    id: com.alcor.flasher
    name: flasher
    icon: icon
    version: latest
    exec: flasher
    exec_args: $@
  pacman:
    Architecture: x86_64
    include:
      - coreutils
      - gtk3
      - wayland
  files:
    exclude:
    - usr/share/man
    - usr/share/doc/*/README.*
    - usr/share/doc/*/changelog.*
    - usr/share/doc/*/NEWS.*
    - usr/share/doc/*/TODO.*
AppImage:
  arch: x86_64
  update-information: guess
